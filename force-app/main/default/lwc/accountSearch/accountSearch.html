<template>
    <lightning-card title="Account Search by Industry" icon-name="standard:account">
        <div class="slds-m-around_medium">
            <!-- Industry Selection -->
            <lightning-combobox
                name="industry"
                label="Select Industry"
                value={selectedIndustry}
                placeholder="Choose an industry"
                options={industryOptions}
                onchange={handleIndustryChange}
            ></lightning-combobox>

            <!-- Search Button -->
            <div class="slds-m-top_medium">
                <lightning-button
                    variant="brand"
                    label="Search"
                    onclick={handleSearch}
                    disabled={isLoading}
                ></lightning-button>
            </div>

            <!-- Loading Spinner -->
            <template if:true={isLoading}>
                <div class="slds-m-top_medium">
                    <lightning-spinner
                        alternative-text="Loading"
                        size="small"
                    ></lightning-spinner>
                </div>
            </template>

            <!-- Error Message -->
            <template if:true={error}>
                <div class="slds-m-top_medium">
                    <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                        <span class="slds-assistive-text">error</span>
                        <h2>{error}</h2>
                    </div>
                </div>
            </template>

            <!-- Results Table -->
            <template if:true={hasAccounts}>
                <div class="slds-m-top_medium">
                    <lightning-datatable
                        key-field="Id"
                        data={accounts}
                        columns={columns}
                        hide-checkbox-column
                    ></lightning-datatable>
                </div>
            </template>

            <!-- No Results Message -->
            <template if:false={hasAccounts}>
                <template if:false={isLoading}>
                    <template if:false={error}>
                        <div class="slds-m-top_medium slds-text-align_center slds-text-color_weak">
                            <p>No accounts found. Try searching for an industry.</p>
                        </div>
                    </template>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
